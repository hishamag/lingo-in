<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lingo-in | Online German Language Learning</title>
    <meta name="description" content="Lingo-in is an online language learning center offering personalized one-to-one and group German lessons with experienced teachers." />
    <meta property="og:title" content="Lingo-in | Learn German Online" />
    <meta property="og:description" content="Learn German online with Lingo-in through personalized one-to-one and group lessons." />
    <meta property="og:image" content="https://lingo-in.com/favicon.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lingo-in | Learn German Online" />
    <meta name="twitter:description" content="Personalized online German language courses, one-to-one or in groups." />
    <meta name="twitter:image" content="https://lingo-in.com/favicon.png" />
    <style>
      .cv-nav-link { display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; text-decoration: none; font-size: 12px; font-weight: 800; line-height: 1; transition: background-color .2s, color .2s, border-color .2s, transform .2s; }
      .cv-nav-link svg { width: 15px; height: 15px; flex: 0 0 auto; }
      .cv-nav-link.desktop { padding: 10px 13px; border: 1px solid #ccefeb; border-radius: 999px; background: #e8faf8; color: #0d8e83; }
      .cv-nav-link.desktop:hover { background: #14b8a6; border-color: #14b8a6; color: #fff; transform: translateY(-1px); }
      .cv-nav-link.mobile { justify-content: flex-start; width: 100%; padding: 11px 0 2px; border-top: 1px solid rgba(255,255,255,.15); color: #8ff4e8; font-size: 13px; }
      .cv-nav-link.mobile:hover { color: #fff; }
      @media (max-width: 1100px) and (min-width: 1024px) { .cv-nav-link.desktop { padding: 9px 10px; font-size: 11px; } .cv-nav-link.desktop svg { width: 14px; height: 14px; } }
      @media (prefers-reduced-motion: reduce) { .cv-nav-link { transition: none; } }
      /* Keep the academic badge clear of the portrait's face. */
      .profile-seal { right: -18px; bottom: -24px; width: 72px; height: 72px; }
      @media (max-width: 640px) { .profile-seal { right: -14px; bottom: -20px; width: 68px; height: 68px; } }
    </style>
    <script>
      (() => {
        const cvLabels = {
          en: { label: 'CV Builder', mobileLabel: 'German CV Builder', aria: 'Open the German CV Builder' },
          fr: { label: 'Créateur de CV', mobileLabel: 'Créateur de CV allemand', aria: 'Ouvrir le créateur de CV allemand' },
          de: { label: 'Lebenslauf-Editor', mobileLabel: 'Deutscher Lebenslauf-Editor', aria: 'Den Lebenslauf-Editor öffnen' },
          ar: { label: 'صانع السيرة الذاتية', mobileLabel: 'صانع السيرة الذاتية الألمانية', aria: 'فتح صانع السيرة الذاتية الألمانية' }
        };

        const getLanguage = () => {
          const title = document.querySelector('.language-option.active')?.getAttribute('title')?.toLowerCase() || '';
          if (title.includes('français') || title.includes('french')) return 'fr';
          if (title.includes('deutsch') || title.includes('german')) return 'de';
          if (title.includes('arab')) return 'ar';
          return 'en';
        };

        const makeLink = (nav, language) => {
          const isDesktop = nav.classList.contains('lg:flex');
          const label = cvLabels[language];
          const link = document.createElement('a');
          link.href = '/lebenslauf.html';
          link.dataset.cvNav = 'true';
          link.className = `cv-nav-link ${isDesktop ? 'desktop' : 'mobile'}`;
          link.setAttribute('aria-label', label.aria);
          link.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18M10 12v2h4v-2"/></svg><span></span>';
          link.querySelector('span').textContent = isDesktop ? label.label : label.mobileLabel;
          nav.appendChild(link);
        };

        const ensureCvLinks = () => {
          const language = getLanguage();
          document.querySelectorAll('header nav').forEach((nav) => {
            if (!nav.querySelector('[data-cv-nav]')) makeLink(nav, language);
          });
        };

        const refreshCvLabels = () => {
          const language = getLanguage();
          const labels = cvLabels[language];
          document.documentElement.lang = language;
          ensureCvLinks();
          document.querySelectorAll('header nav [data-cv-nav]').forEach((link) => {
            const isDesktop = link.closest('nav').classList.contains('lg:flex');
            link.setAttribute('aria-label', labels.aria);
            link.querySelector('span').textContent = isDesktop ? labels.label : labels.mobileLabel;
          });
        };

        // The observer only adds missing links. It never reacts to label text or
        // class updates, avoiding a child-list mutation loop that can freeze React.
        new MutationObserver(ensureCvLinks).observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener('click', (event) => {
          if (event.target.closest('.language-option')) requestAnimationFrame(refreshCvLabels);
        });
        document.addEventListener('DOMContentLoaded', refreshCvLabels);
        refreshCvLabels();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
